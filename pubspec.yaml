name: vertiege
description: "Vertiege — tier-gated social network"
publish_to: 'none'
version: 1.0.0-beta.3+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  supabase_flutter: ^2.8.3
  http: ^1.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  in_app_purchase: ^3.2.0
  flutter_markdown: ^0.7.6
  livekit_client: ^2.5.3
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/banners/
    - assets/decorations/
    - assets/generated/
    - assets/icons/
    - assets/images/
