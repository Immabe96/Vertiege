name: vertiege
description: "Vertiege — tier-gated social network"
publish_to: 'none'
version: 1.0.0-beta.3+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  supabase_flutter: ^2.8.3
  flutter_svg: ^2.0.17
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    - assets/decorations/
    - assets/generated/
    - assets/icons/
    - assets/images/
