name: CI

on:
  push:
    branches:
      - main
      - design-overhaul
      - 'jules-*'
      - 'fix-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI environment placeholder
        run: touch .env

      - name: Analyze compile errors
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "^[[:space:]]*error[[:space:]]+[•-]" analyze.log; then
            echo "Flutter analyzer reported compile errors."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Flutter analyzer reported only warnings/info; continuing so tests and APK build can run."
          fi

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vertiege-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
