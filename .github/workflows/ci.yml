# Fast verify on every push/PR; release APK only on develop (or manual dispatch).
# main is updated after this workflow succeeds (see promote-to-main.yml).
# Android: applicationId com.vertiege — google-services.json must stay in android/app/.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY — embedded in CI .env for the APK
#   ANDROID_KEYSTORE_BASE64 — base64 -w0 android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS (optional, default upload)
# Without Android signing secrets, build-apk falls back to debug signing.
name: CI

on:
  push:
    branches:
      - develop
      - 'phase-*'
      - 'fix-*'
      - 'feature/*'
      - 'cursor/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build release APK after verify (develop / manual only)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate assets
        run: bash scripts/validate_assets.sh

      - name: Create CI .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            touch .env
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets missing; APK will launch in offline mode"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  verify-ios:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: CocoaPods
        run: cd ios && pod install

      - name: Build iOS (simulator, compile check)
        run: flutter build ios --simulator --no-tree-shake-icons

  build-apk:
    needs: verify
    if: >
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.build_apk)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'android/**/*.kt*', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          else
            touch .env
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets missing; APK will launch in offline mode"
          fi

      - name: Configure release signing from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/ci-setup-android-signing.sh

      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --target-platform android-arm64

      - name: Prune old APK artifacts (storage quota)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEEP_COUNT: '2'
          ARTIFACT_PRUNE_MODE: aggressive
        run: bash scripts/ci-prune-github-artifacts.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertiege-apk-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

