# Weekly prune of CI APK artifacts (storage quota).
name: Cleanup artifacts

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_KEEP_COUNT: '2'
        run: bash scripts/ci-prune-github-artifacts.sh
