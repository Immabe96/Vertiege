# Runs when main is updated after a successful develop build.
# Publishes a GitHub Release with a downloadable APK.
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI environment placeholder
        run: touch .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Read app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          TAG=$(echo "$RAW" | sed 's/+/-/g')
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v${TAG}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertiege-release-${{ steps.version.outputs.tag }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vertiege ${{ steps.version.outputs.raw }} (${{ github.sha }})
          body: |
            Buildable release APK from `main` after develop CI passed.

            - **Version:** ${{ steps.version.outputs.raw }}
            - **Commit:** ${{ github.sha }}
            - **Workflow:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Download **app-release.apk** below.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          generate_release_notes: false
