# Publishes GitHub Release using the APK from the develop CI run (no second compile).
name: Release APK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run ID (leave empty = latest successful develop CI with APK)
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve CI run ID
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ID=$(gh run list --workflow=ci.yml --branch=develop --status=success --limit=20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")] | .[0].databaseId')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "No successful develop CI run found" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download APK from CI
        uses: actions/download-artifact@v4
        with:
          name: vertiege-apk-${{ steps.ci_run.outputs.id }}
          run-id: ${{ steps.ci_run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Read app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          TAG=$(echo "$RAW" | sed 's/+/-/g')
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v${TAG}-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vertiege ${{ steps.version.outputs.raw }} (${{ steps.version.outputs.sha }})
          target_commitish: ${{ steps.version.outputs.sha }}
          body: |
            Release APK from develop CI (no rebuild on `main`).

            - **Version:** ${{ steps.version.outputs.raw }}
            - **Commit:** ${{ steps.version.outputs.sha }}
            - **CI run:** [${{ steps.ci_run.outputs.id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci_run.outputs.id }})

            Download **app-release.apk** below.
          files: apk/app-release.apk
          make_latest: true
          generate_release_notes: false
